<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Semaphore Modern Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        #game-wrapper {
            width: 100vw;
            height: 56.25vw;
            max-width: 100%;
            max-height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #16213e, #0f3460);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #game-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1280px;
            height: 720px;
            transform-origin: center center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #splash-screen {
            background: radial-gradient(circle, #1f4068 0%, #16213e 100%);
        }

        .title-container {
            text-align: center;
            margin-bottom: 20px;
            animation: pulse 2s infinite alternate;
        }

        h1 {
            font-size: 64px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #e94560;
            text-shadow: 0 4px 10px rgba(233, 69, 96, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 24px;
            color: #00d2d3;
            letter-spacing: 2px;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #ff5773;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(233, 69, 96, 0.6);
        }

        .btn:disabled {
            background-color: #4a4a5a;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .menu-grid {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }

        .level-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #00d2d3;
            border-radius: 20px;
            padding: 12px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .level-btn:hover {
            background: rgba(0, 210, 211, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 210, 211, 0.2);
        }

        .level-btn h3 {
            font-size: 18px;
            color: #00d2d3;
            margin-bottom: 6px;
        }

        .level-btn p {
            font-size: 14px;
            color: #aaa;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 25px;
            padding: 0 50px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 15px;
            font-size: 18px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #level-indicator {
            color: #00d2d3;
            font-weight: bold;
        }

        .display-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 320px;
            height: 320px;
            margin-top: 40px;
            background-image: radial-gradient(white, rgba(0,0,0,0.1));
            border-radius: 180px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .semaphore-img {
            height: 300px;
            object-fit: contain;
        }

        .sequence-controls {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 25px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #555;
            transition: background-color 0.3s;
        }

        .status-dot.active {
            background-color: #00d2d3;
            box-shadow: 0 0 10px #00d2d3;
        }

        .status-dot.space {
            background-color: #e94560;
            width: 8px;
            height: 8px;
        }

        .input-area {
            margin-top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .answer-input {
            width: 450px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #00d2d3;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 24px;
            color: white;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .answer-input:focus {
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-ok {
            background-color: #1dd1a1;
            padding: 12px 35px;
            font-size: 22px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(29, 209, 161, 0.3);
        }

        .btn-ok:hover {
            background-color: #10ac84;
            box-shadow: 0 10px 20px rgba(29, 209, 161, 0.5);
        }

        /* Keyboard Virtual Level 1 (2 Baris) */
        .keyboard-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .keyboard-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .letter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00d2d3;
            color: white;
            font-size: 20px;
            font-weight: bold;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-btn:hover {
            background-color: #00d2d3;
            color: #1a1a2e;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        }

        .feedback {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
            height: 30px;
            transition: all 0.2s;
        }
        .correct { color: #1dd1a1; text-shadow: 0 0 10px rgba(29,209,161,0.3); }
        .wrong { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,107,107,0.3); }

        .score-summary {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 20px;
            width: 500px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-val {
            font-size: 72px;
            color: #00d2d3;
            font-weight: bold;
            margin: 15px 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            
            <!-- 1. SPLASH SCREEN & MENU LEVEL -->
            <div id="splash-screen" class="screen active">
                <div class="title-container">
                    <svg viewBox="0 0 500 150" width="100%" height="150">
                        <defs>
                            <path id="curve" d="M 50,120 Q 250,30 450,120" fill="transparent" />
                        </defs>
                        <text font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="46" font-weight="bold" fill="#e94560">
                            <textPath href="#curve" startOffset="50%" text-anchor="middle">
                                GAME SEMAPHORE
                            </textPath>
                        </text>
                    </svg>
                    <div style="margin-bottom: 20px; height: 200px; display: flex; justify-content: center; align-items: center;">
                        <img src="img/u.png" id="splash-anim-frame" style="height: 100%; object-fit: contain;">
                    </div>
                    <div class="subtitle">Pilih Level untuk Memulai Permainan</div>
                </div>
                
                <div class="menu-grid">
                    <div class="level-btn" onclick="startLevel(1)">
                        <h3>LEVEL 1</h3>
                        <img src="img/a.png" height="120px">
                        <p style="margin-top:5px; color:#00d2d3; font-weight:bold;">Tebak Huruf</p>
                    </div>
                    <div class="level-btn" onclick="startLevel(2)">
                        <h3>LEVEL 2</h3>
                        <img src="img/b.png" height="120px">
                        <p style="margin-top:5px; color:#00d2d3; font-weight:bold;">Tebak Kata</p>
                    </div>
                    <div class="level-btn" onclick="startLevel(3)">
                        <h3>LEVEL 3</h3>
                        <img src="img/c.png" height="120px">
                        <p style="margin-top:5px; color:#00d2d3; font-weight:bold;">Tebak Kalimat</p>
                    </div>
                    <div class="level-btn" onclick="window.open('https://s.shopee.co.id/5foDoPLDew','_blank')">
                        <h3>BELANJA</h3>
                        <img src="https://down-id.img.susercontent.com/file/id-11134207-822wo-mnqs24vfnthh0d@resize_w450_nl.webp" width="120px">
                        <p style="margin-top:5px; color:#00d2d3; font-weight:bold;">Shopee</p>
                    </div>
                </div>
            </div>

            <!-- 2. GAMEPLAY SCREEN -->
            <div id="game-screen" class="screen">
                <div class="game-header">
                    <div class="info-box" id="level-indicator">LEVEL 1: TEBAK HURUF</div>
                    <div class="info-box" id="question-indicator">Soal: 1 / 5</div>
                    <div class="info-box" id="replay-indicator">Sisa Ulangi: 3</div>
                    <div class="info-box" id="wrong-indicator" style="color: #ff6b6b;">Salah: 0 / 3</div>
                    <div class="info-box" id="score-indicator">Skor Game: 0</div>
                </div>

                <div class="display-area" id="display-area"></div>

                <div class="sequence-controls" id="sequence-dots"></div>
                <div style="margin-top: 5px;" id="replay-container"></div>

                <div class="input-area" id="input-area"></div>
                <div class="feedback" id="feedback-msg"></div>
            </div>

            <!-- 3. FINISH SCREEN -->
            <div id="finish-screen" class="screen">
                <div class="title-container">
                    <h1 id="finish-title">Selesai!</h1>
                    <div class="subtitle" id="finish-subtitle">Level Berhasil Diselesaikan</div>
                </div>
                <div class="score-summary">
                    <div>Skor Anda pada Level Ini:</div>
                    <div class="score-val" id="final-score">0</div>
                    <div id="performance-rating" style="font-size: 20px; font-weight: bold;">Luar Biasa!</div>
                </div>
                <button class="btn" onclick="returnToMenu()">Kembali ke Menu</button>
            </div>

        </div>
    </div>

    <script>
        // Audio Engine
        const audio = {
            beep: new Audio('sound/beep.mp3'),
            correct: new Audio('sound/correct.mp3'),
            wrong: new Audio('sound/wrong.mp3'),
            win: new Audio('sound/win.mp3'),
            lose: new Audio('sound/lose.mp3')
        };

        function playSound(soundName) {
            if (audio[soundName]) {
                audio[soundName].currentTime = 0;
                audio[soundName].play().catch(e => console.log("Audio play blocked/failed:", e));
            }
        }

        // PRELOAD IMAGE ENGINE
        // Memuat seluruh gambar ke memori browser agar transisi tidak terlambat/lag
        const imageCache = [];
        const imageList = [
            'img/siap.png',
            ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(char => `img/${char.toLowerCase()}.png`)
        ];

        function preloadImages() {
            imageList.forEach(src => {
                const img = new Image();
                img.src = src;
                imageCache.push(img);
            });
        }

        // Mencegah Klik Kanan & Shortcut bawaan browser
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && currentLevel !== 1) {
                e.preventDefault();
                checkAnswer();
            }
        });

        // Pengaturan Skala Proporsional 16:9
        function adjustGameScale() {
            const wrapper = document.getElementById('game-wrapper');
            const container = document.getElementById('game-container');
            const scale = Math.min(wrapper.clientWidth / 1280, wrapper.clientHeight / 720);
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', adjustGameScale);
        window.addEventListener('load', adjustGameScale);

        // DATA GAMEPLAY
        const gameData = {
            1: [ 
                { answer: "A" }, { answer: "B" }, { answer: "C" }, { answer: "D" }, { answer: "E" },
                { answer: "F" }, { answer: "G" }, { answer: "H" }, { answer: "I" }, { answer: "J" },
                { answer: "K" }, { answer: "L" }, { answer: "M" }, { answer: "N" }, { answer: "O" },
                { answer: "P" }, { answer: "Q" }, { answer: "R" }, { answer: "S" }, { answer: "T" },
                { answer: "U" }, { answer: "V" }, { answer: "W" }, { answer: "X" }, { answer: "Y" }, 
                { answer: "Z" }
            ],
            2: [ 
                { answer: "PRAMUKA" }, { answer: "SANDI" }, { answer: "TUNAS" }, { answer: "SIAGA" }, { answer: "BANTU" },
                { answer: "PENGGALANG" }, { answer: "PENEGAK" },  { answer: "PANDEGA" },  { answer: "KEMAH" }, { answer: "TONGKAT" },
                { answer: "TALI" }, { answer: "KOMPAS" }, { answer: "BANTARA" }, { answer: "LAKSANA" }, { answer: "BHAYANGKARA"},
                { answer: "SEMAPHORE"}, { answer: "PRADANA"}, { answer: "PRATAMA"},   { answer: "PANDU"}, { answer: "WIRA KARTIKA"},
                { answer: "API UNGGUN"}, { answer: "DWISATYA"}, { answer: "DWIDARMA"},  { answer: "MINGGU"}, { answer: "BAKTI HUSADA"},
                { answer: "MAAF"}, { answer: "WANA BAKTI"}, { answer: "DIRGANTARA"}, { answer: "TARUNA BUMI"},    
            ],
            3: [ 
                { answer: "SALAM PRAMUKA" }, { answer: "SAYA ANAK INDONESIA" }, { answer: "SIAP SEDIA SETIAP SAAT" }, 
                { answer: "DISIPLIN BERANI DAN SETIA" }, { answer: "PRAJA MUDA KARANA" }, { answer: "DASADARMA PRAMUKA" },
                { answer: "PATUH DAN SUKA BERMUSYAWARAH" }, { answer: "IKHLAS BAKTI BINA BANGSA" }, { answer: "HEMAT CERMAT DAN BERSAHAJA" },
                { answer: "AYO LATIHAN BERSAMA" }, { answer: "RAJIN TERAMPIL DAN GEMBIRA" }, { answer: "KAMI MANUSIA PANCASILA" }
            ]
        };

        // State Gameplay
        let currentLevel = 1;
        let currentQuestionIdx = 0;
        let score = 0;
        let totalWrongCount = 0;
        let totalReplayCount = 3;
        let activeSessionQuestions = [];
        
        let sequenceTimeouts = [];
        let currentSequence = [];

        const splashScreen = document.getElementById('splash-screen');
        const gameScreen = document.getElementById('game-screen');
        const finishScreen = document.getElementById('finish-screen');

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function clearAllTimeouts() {
            sequenceTimeouts.forEach(t => clearTimeout(t));
            sequenceTimeouts = [];
        }

        function showScreen(screen) {
            [splashScreen, gameScreen, finishScreen].forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
            adjustGameScale();
        }

        function startLevel(levelNum) {
            currentLevel = levelNum;
            currentQuestionIdx = 0;
            score = 0;
            totalWrongCount = 0;
            totalReplayCount = 3;

            const shuffledPool = shuffleArray(gameData[currentLevel]);
            activeSessionQuestions = shuffledPool.slice(0, 10);
            
            showScreen(gameScreen);
            loadQuestion();
        }

        function returnToMenu() {
            clearAllTimeouts();
            showScreen(splashScreen);
        }

        function loadQuestion() {
            clearAllTimeouts();
            
            document.getElementById('feedback-msg').textContent = "";
            document.getElementById('feedback-msg').className = "feedback";
            
            let levelTitle = ["", "LEVEL 1: TEBAK HURUF", "LEVEL 2: TEBAK KATA", "LEVEL 3: TEBAK KALIMAT"][currentLevel];
            document.getElementById('level-indicator').textContent = levelTitle;
            document.getElementById('question-indicator').textContent = `Soal: ${currentQuestionIdx + 1} / 10`;
            document.getElementById('replay-indicator').textContent = `Sisa Ulangi: ${totalReplayCount}`;
            document.getElementById('wrong-indicator').textContent = `Salah: ${totalWrongCount} / 3`;
            document.getElementById('score-indicator').textContent = `Skor: ${score}`;

            const currentData = activeSessionQuestions[currentQuestionIdx];
            const answerStr = currentData.answer;

            const displayArea = document.getElementById('display-area');
            const dotsContainer = document.getElementById('sequence-dots');
            const replayContainer = document.getElementById('replay-container');
            const inputArea = document.getElementById('input-area');
            
            displayArea.innerHTML = "";
            dotsContainer.innerHTML = "";
            replayContainer.innerHTML = "";
            inputArea.innerHTML = "";

            if (currentLevel === 1) {
                // Tampilan Peragaan Gambar Level 1
                const img = document.createElement('img');
                img.src = `img/${answerStr.toLowerCase()}.png`;
                img.className = 'semaphore-img';
                img.onerror = function() { this.src = 'img/siap.png'; };
                displayArea.appendChild(img);
                playSound('beep'); 

                // Tampilan Keyboard Virtual A-Z Dalam 2 Baris (A-M & N-Z)
                const kbContainer = document.createElement('div');
                kbContainer.className = 'keyboard-container';

                const row1 = document.createElement('div');
                row1.className = 'keyboard-row';
                const row2 = document.createElement('div');
                row2.className = 'keyboard-row';

                "ABCDEFGHIJKLM".split("").forEach(char => {
                    const btn = document.createElement('button');
                    btn.className = 'letter-btn';
                    btn.textContent = char;
                    btn.onclick = () => selectLetter(char);
                    row1.appendChild(btn);
                });

                "NOPQRSTUVWXYZ".split("").forEach(char => {
                    const btn = document.createElement('button');
                    btn.className = 'letter-btn';
                    btn.textContent = char;
                    btn.onclick = () => selectLetter(char);
                    row2.appendChild(btn);
                });

                kbContainer.appendChild(row1);
                kbContainer.appendChild(row2);
                inputArea.appendChild(kbContainer);

            } else {
                // Input Teks untuk Level 2 & 3
                const row = document.createElement('div');
                row.className = 'input-row';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'answer-input';
                input.className = 'answer-input';
                input.placeholder = 'Ketik jawaban di sini...';
                input.autocomplete = 'off';

                const btnOk = document.createElement('button');
                btnOk.className = 'btn btn-ok';
                btnOk.id = 'btn-submit';
                btnOk.textContent = 'OK';
                btnOk.onclick = checkAnswer;

                row.appendChild(input);
                row.appendChild(btnOk);
                inputArea.appendChild(row);

                currentSequence = Array.from(answerStr);
                
                currentSequence.forEach((char, index) => {
                    const dot = document.createElement('div');
                    dot.className = char === ' ' ? 'status-dot space' : 'status-dot';
                    dot.id = `dot-${index}`;
                    dotsContainer.appendChild(dot);
                });

                const replayBtn = document.createElement('button');
                replayBtn.className = 'btn';
                replayBtn.id = 'btn-replay-action';
                replayBtn.style.padding = '8px 20px';
                replayBtn.style.fontSize = '14px';
                replayBtn.textContent = `Putar Ulang Isyarat (${totalReplayCount})`;
                replayBtn.onclick = triggerReplay;
                if(totalReplayCount <= 0) replayBtn.disabled = true;
                replayContainer.appendChild(replayBtn);

                playSequence();
            }
        }

        function selectLetter(char) {
            const btns = document.querySelectorAll('.letter-btn');
            btns.forEach(b => b.disabled = true);
            checkAnswer(char);
        }

        function triggerReplay() {
            if(totalReplayCount > 0) {
                totalReplayCount--;
                document.getElementById('replay-indicator').textContent = `Sisa Ulangi: ${totalReplayCount}`;
                const rBtn = document.getElementById('btn-replay-action');
                if(rBtn) {
                    rBtn.textContent = `Putar Ulang Isyarat (${totalReplayCount})`;
                    if(totalReplayCount <= 0) rBtn.disabled = true;
                }
                playSequence();
            }
        }

        /* TRANSISI ISYARAT ASLI SEMAPHORE:
           1. Pergantian antar-huruf yang berbeda langsung dilakukan.
           2. Tampil posisi 'siap.png' HANYA saat ada SPASI atau HURUF KEMBAR berurutan. */
        function playSequence() {
            clearAllTimeouts();
            const displayArea = document.getElementById('display-area');
            
            displayArea.innerHTML = `<img src="img/siap.png" class="semaphore-img" id="anim-frame">`;
            resetDots();

            const imgFrame = document.getElementById('anim-frame');
            const letterDuration = 1000; // Tampil 1 detik per huruf
            const pauseRepeatDuration = 300; // Jeda posisi siap untuk huruf kembar/spasi (ms)
            
            let currentTime = 200; 

            currentSequence.forEach((char, idx) => {
                let prevChar = idx > 0 ? currentSequence[idx - 1] : null;

                // Cek jika huruf SAMA dengan huruf sebelumnya (misal 'A' & 'A' di "MAAF")
                if (prevChar && char === prevChar && char !== ' ') {
                    let tPause = setTimeout(() => {
                        if(!imgFrame) return;
                        imgFrame.src = 'img/siap.png';
                    }, currentTime);
                    sequenceTimeouts.push(tPause);
                    
                    currentTime += pauseRepeatDuration;
                }

                // Tampilkan huruf
                let tShow = setTimeout(() => {
                    if(!imgFrame) return;
                    highlightDot(idx);
                    imgFrame.src = char === ' ' ? 'img/siap.png' : `img/${char.toLowerCase()}.png`;
                    if (char !== ' ') playSound('beep');
                }, currentTime);
                sequenceTimeouts.push(tShow);

                currentTime += letterDuration;
            });

            // Selesai animasi sekuens
            let tEnd = setTimeout(() => {
                if(!imgFrame) return;
                imgFrame.src = "img/siap.png";
                resetDots();
                const input = document.getElementById('answer-input');
                if(input) input.focus();
            }, currentTime);
            sequenceTimeouts.push(tEnd);
        }

        function resetDots() {
            document.querySelectorAll('.status-dot').forEach(d => d.classList.remove('active'));
        }

        function highlightDot(idx) {
            resetDots();
            const targetDot = document.getElementById(`dot-${idx}`);
            if(targetDot) targetDot.classList.add('active');
        }

        function checkAnswer(chosenChar = null) {
            clearAllTimeouts();

            const currentData = activeSessionQuestions[currentQuestionIdx];
            let userAnswer = "";

            if (currentLevel === 1) {
                userAnswer = chosenChar;
            } else {
                const input = document.getElementById('answer-input');
                if(!input || input.disabled) return;
                userAnswer = input.value.trim().toUpperCase();
                input.disabled = true;
                const btnSubmit = document.getElementById('btn-submit');
                if(btnSubmit) btnSubmit.disabled = true;
            }

            const feedbackMsg = document.getElementById('feedback-msg');

            if (userAnswer === currentData.answer) {
                playSound('correct');
                feedbackMsg.textContent = "BENAR!";
                feedbackMsg.className = "feedback correct";
                score += (currentLevel * 10);
                
                document.getElementById('score-indicator').textContent = `Skor: ${score}`;

                setTimeout(() => {
                    nextQuestion();
                }, 2000);
            } else {
                playSound('wrong');
                totalWrongCount++;
                document.getElementById('wrong-indicator').textContent = `Salah: ${totalWrongCount} / 3`;
                
                feedbackMsg.textContent = `SALAH! Jawaban yang benar: ${currentData.answer}`;
                feedbackMsg.className = "feedback wrong";

                setTimeout(() => {
                    if (totalWrongCount >= 3) {
                        endGame(false);
                    } else {
                        nextQuestion();
                    }
                }, 2000);
            }
        }

        function nextQuestion() {
            currentQuestionIdx++;
            if (currentQuestionIdx >= 10) {
                endGame(true);
            } else {
                loadQuestion();
            }
        }

        function endGame(isWin) {
            clearAllTimeouts();
            showScreen(finishScreen);
            document.getElementById('final-score').textContent = score;
            
            const title = document.getElementById('finish-title');
            const subtitle = document.getElementById('finish-subtitle');
            const rating = document.getElementById('performance-rating');

            if (isWin) {
                playSound('win');
                title.textContent = "LEVEL SELESAI!";
                title.style.color = "#1dd1a1";
                subtitle.textContent = "Kamu berhasil menyelesaikan level ini!";
                rating.textContent = "Luar Biasa! Kemampuanmu Sangat Hebat.";
                rating.style.color = "#1dd1a1";
            } else {
                playSound('lose');
                title.textContent = "GAME OVER!";
                title.style.color = "#e94560";
                subtitle.textContent = "Kamu salah sebanyak 3 kali pada level ini.";
                rating.textContent = "Jangan Menyerah! Coba lagi dan pertajam analisismu.";
                rating.style.color = "#ff6b6b";
            }
        }

        // Animasi Isyarat Perhatian U - R
        let splashState = 0;
        function startSplashAnimation() {
            const splashImg = document.getElementById('splash-anim-frame');
            if (!splashImg) return;
            
            setInterval(() => {
                if (splashState === 0) {
                    splashImg.src = "img/r.png";
                    splashState = 1;
                } else {
                    splashImg.src = "img/u.png";
                    splashState = 0;
                }
            }, 500);
        }

        // Event Listener Awal (Preload + Animasi Splash)
        window.addEventListener('DOMContentLoaded', () => {
            preloadImages();
            startSplashAnimation();
        });

        // Layer Keamanan
        (function() {
            window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
            window.addEventListener('keydown', function(e) {
                if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
            }, true);
        })();
    </script>
</body>
</html>
